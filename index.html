<!DOCTYPE html>
<html>
<head>
    <title>CampaignHQ - Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #output { margin-top: 20px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>🗳️ CampaignHQ - Connection Test</h1>
    <button onclick="testConnection()">🔌 Test Connection</button>
    <div id="output"></div>

    <script>
        // ============================================
        // YOUR EXACT CREDENTIALS
        // ============================================
        const SUPABASE_URL = 'https://sbomlqemmtcfahtgllzx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tU-qC7J1igIq0R_UM1_COA_F-uVpA9Y';

        const output = document.getElementById('output');

        async function testConnection() {
            output.innerHTML = '⏳ Testing...';
            output.className = '';

            try {
                // 1. Check if Supabase library loaded
                if (typeof window.supabase === 'undefined') {
                    output.innerHTML = '❌ Supabase library not loaded! Check internet.';
                    output.className = 'error';
                    return;
                }

                // 2. Initialize client
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                output.innerHTML += '<br>✅ Supabase client created.';

                // 3. Attempt login
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: 'admin@campaign.com',
                    password: 'Campaign123!'
                });

                if (authError) {
                    output.innerHTML += `<br>❌ Login failed: ${authError.message}`;
                    output.className = 'error';
                    return;
                }

                output.innerHTML += `<br>✅ Logged in as: ${authData.user.email}`;

                // 4. Fetch voters
                const { data: voters, error: votersError } = await supabase
                    .from('voters')
                    .select('*')
                    .limit(5);

                if (votersError) {
                    output.innerHTML += `<br>❌ Fetch error: ${votersError.message}`;
                    output.className = 'error';
                    return;
                }

                output.innerHTML += `<br>✅ Success! Loaded ${voters.length} voters.`;
                output.className = 'success';

                // Show first voter
                if (voters.length > 0) {
                    output.innerHTML += `<br><br>📋 First voter: <pre>${JSON.stringify(voters[0], null, 2)}</pre>`;
                }

            } catch (err) {
                output.innerHTML = `❌ Exception: ${err.message}`;
                output.className = 'error';
            }
        }

        // Auto-test on page load
        window.onload = function() {
            testConnection();
        };
    </script>
</body>
</html>
