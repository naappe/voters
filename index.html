<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #1a1a2e;
        }
        .header-actions {
            text-align: right;
            margin-bottom: 15px;
        }
        .header-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 8px;
        }
        .btn-success {
            background: #22c55e;
            color: white;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .card .number {
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
        }
        .card .label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }
        .filters {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .filters input,
        .filters select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            flex: 1;
            min-width: 120px;
        }
        .filters button {
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }
        .table-container {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e5e7eb;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #e5e7eb;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .status {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }
        .status-Not-Contacted {
            background: #e5e7eb;
            color: #4b5563;
        }
        .status-Reached {
            background: #dbeafe;
            color: #1e40af;
        }
        .status-Supporter {
            background: #ede9fe;
            color: #6d28d9;
        }
        .status-Undecided {
            background: #fef3c7;
            color: #92400e;
        }
        .status-Opposition {
            background: #fee2e2;
            color: #991b1b;
        }
        .actions button {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 2px;
        }
        .btn-edit {
            background: #dbeafe;
            color: #2563eb;
        }
        .btn-delete {
            background: #fee2e2;
            color: #dc2626;
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .pagination button {
            padding: 6px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            cursor: pointer;
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            display: none;
            z-index: 999;
        }
        .toast.success {
            background: #22c55e;
        }
        .toast.error {
            background: #ef4444;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 {
            margin-bottom: 20px;
        }
        .modal-content input,
        .modal-content select,
        .modal-content textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .close {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        @media (max-width: 600px) {
            .cards {
                grid-template-columns: repeat(3, 1fr);
            }
            .filters {
                flex-direction: column;
            }
            .filters input,
            .filters select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗳️ Voter Dashboard</h1>

        <!-- Header Actions -->
        <div class="header-actions">
            <span id="userInfo" style="margin-right:15px;color:#666;"></span>
            <button class="btn-success" onclick="exportCSV()">📤 Export</button>
            <button class="btn-primary" onclick="openModal()">➕ Add</button>
            <button class="btn-primary" onclick="window.location.href='mobile.html'">📱 Mobile</button>
        </div>

        <!-- KPI Cards -->
        <div class="cards" id="kpiCards">
            <div class="card"><div class="number" id="total">0</div><div class="label">Total</div></div>
            <div class="card"><div class="number" id="reached">0</div><div class="label">Reached</div></div>
            <div class="card"><div class="number" id="supporters">0</div><div class="label">Supporters</div></div>
            <div class="card"><div class="number" id="undecided">0</div><div class="label">Undecided</div></div>
            <div class="card"><div class="number" id="notContacted">0</div><div class="label">Not Contacted</div></div>
            <div class="card"><div class="number" id="opposition">0</div><div class="label">Opposition</div></div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <input type="text" id="searchName" placeholder="🔍 Search by name..." oninput="applyFilters()">
            <select id="filterStatus" onchange="applyFilters()">
                <option value="">All Status</option>
                <option value="Not Contacted">Not Contacted</option>
                <option value="Reached">Reached</option>
                <option value="Supporter">Supporter</option>
                <option value="Undecided">Undecided</option>
                <option value="Opposition">Opposition</option>
            </select>
            <button class="btn-primary" onclick="applyFilters()">Apply</button>
            <button class="btn-secondary" onclick="clearFilters()">Clear</button>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>National ID</th>
                        <th>District</th>
                        <th>Status</th>
                        <th>Party</th>
                        <th>Sex</th>
                        <th>Age</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="8" class="loading">Loading voters...</td></tr>
                </tbody>
            </table>
            <div class="pagination">
                <span id="pageInfo">Showing 0-0 of 0</span>
                <div>
                    <button id="prevBtn" onclick="prevPage()">← Prev</button>
                    <button id="nextBtn" onclick="nextPage()">Next →</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Add Voter</h2>
            <form id="voterForm" onsubmit="handleSubmit(event)">
                <input type="hidden" id="editId">
                <input type="text" id="formName" placeholder="Full Name" required>
                <input type="text" id="formNationalId" placeholder="National ID" required>
                <input type="text" id="formDistrict" placeholder="District">
                <input type="text" id="formHouse" placeholder="House">
                <input type="text" id="formPhone" placeholder="Phone">
                <select id="formStatus">
                    <option value="Not Contacted">Not Contacted</option>
                    <option value="Reached">Reached</option>
                    <option value="Supporter">Supporter</option>
                    <option value="Undecided">Undecided</option>
                    <option value="Opposition">Opposition</option>
                </select>
                <input type="text" id="formParty" placeholder="Party">
                <input type="text" id="formSex" placeholder="Sex">
                <input type="number" id="formAge" placeholder="Age">
                <textarea id="formNotes" rows="3" placeholder="Notes"></textarea>
                <div class="modal-actions">
                    <button type="button" style="background:#e5e7eb;" onclick="closeModal()">Cancel</button>
                    <button type="submit" style="background:#22c55e;color:white;">✅ Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================
        // SUPABASE CONFIG - CORRECT URL!
        // ============================================
        const SUPABASE_URL = 'https://sbomlqemmtcfahgtllzx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tU-qC7J1igIq0R_UM1_COA_F-uVpA9Y';

        const supabase = supabaseClient.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============================================
        // AUTO-LOGIN
        // ============================================
        const EMAIL = 'admin@campaign.com';
        const PASSWORD = 'Campaign123!';

        let allVoters = [];
        let filteredVoters = [];
        let currentPage = 0;
        const PAGE_SIZE = 15;

        // ============================================
        // LOGIN
        // ============================================
        async function autoLogin() {
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: EMAIL,
                    password: PASSWORD
                });
                if (error) throw error;
                localStorage.setItem('user', JSON.stringify(data.user));
                document.getElementById('userInfo').textContent = '✅ Logged in: ' + data.user.email;
                await loadVoters();
                showToast('✅ Logged in successfully!', 'success');
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('userInfo').textContent = '❌ Login failed';
                // Try to create user
                try {
                    const { data } = await supabase.auth.signUp({
                        email: EMAIL,
                        password: PASSWORD
                    });
                    if (data.user) {
                        showToast('✅ User created! Retrying login...', 'success');
                        setTimeout(autoLogin, 2000);
                    }
                } catch (e) {
                    showToast('❌ Please create user in Supabase Auth', 'error');
                }
            }
        }

        // ============================================
        // LOAD VOTERS
        // ============================================
        async function loadVoters() {
            try {
                const { data, error } = await supabase
                    .from('voters')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allVoters = data || [];
                filteredVoters = [...allVoters];
                updateDashboard();
                renderTable();
                console.log('✅ Loaded', allVoters.length, 'voters');
                showToast('✅ Loaded ' + allVoters.length + ' voters', 'success');
            } catch (error) {
                console.error('Error loading voters:', error);
                showToast('❌ Error loading voters: ' + error.message, 'error');
                document.getElementById('tableBody').innerHTML =
                    '<tr><td colspan="8" class="loading">❌ Error: ' + error.message + '</td></tr>';
            }
        }

        // ============================================
        // UPDATE DASHBOARD
        // ============================================
        function updateDashboard() {
            const total = allVoters.length;
            const reached = allVoters.filter(v => v.status && v.status !== 'Not Contacted').length;
            const supporters = allVoters.filter(v => v.status === 'Supporter').length;
            const undecided = allVoters.filter(v => v.status === 'Undecided').length;
            const notContacted = allVoters.filter(v => !v.status || v.status === 'Not Contacted').length;
            const opposition = allVoters.filter(v => v.status === 'Opposition').length;

            document.getElementById('total').textContent = total;
            document.getElementById('reached').textContent = reached;
            document.getElementById('supporters').textContent = supporters;
            document.getElementById('undecided').textContent = undecided;
            document.getElementById('notContacted').textContent = notContacted;
            document.getElementById('opposition').textContent = opposition;
        }

        // ============================================
        // RENDER TABLE
        // ============================================
        function renderTable() {
            const start = currentPage * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, filteredVoters.length);
            const pageData = filteredVoters.slice(start, end);
            const tbody = document.getElementById('tableBody');

            if (filteredVoters.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="loading">No voters found</td></tr>';
                document.getElementById('pageInfo').textContent = 'Showing 0-0 of 0';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                return;
            }

            tbody.innerHTML = pageData.map(v => `
                        <tr>
                            <td><strong>${v.name || 'Unknown'}</strong></td>
                            <td>${v.national_id || '-'}</td>
                            <td>${v.district || '-'}</td>
                            <td><span class="status status-${(v.status || 'Not-Contacted').replace(/ /g, '-')}">${v.status || 'Not Contacted'}</span></td>
                            <td>${v.party || '-'}</td>
                            <td>${v.sex || '-'}</td>
                            <td>${v.age || '-'}</td>
                            <td class="actions">
                                <button class="btn-edit" onclick="editVoter('${v.id}')">✏️</button>
                                <button class="btn-delete" onclick="deleteVoter('${v.id}')">🗑️</button>
                            </td>
                        </tr>
                    `).join('');

            document.getElementById('pageInfo').textContent = `Showing ${start + 1}-${end} of ${filteredVoters.length}`;
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage >= Math.ceil(filteredVoters.length / PAGE_SIZE) - 1;
        }

        // ============================================
        // FILTERS
        // ============================================
        function applyFilters() {
            const name = document.getElementById('searchName').value.toLowerCase().trim();
            const status = document.getElementById('filterStatus').value;

            filteredVoters = allVoters.filter(v => {
                let match = true;
                if (name) match = match && (v.name || '').toLowerCase().includes(name);
                if (status) match = match && (v.status || '') === status;
                return match;
            });

            currentPage = 0;
            renderTable();
        }

        function clearFilters() {
            document.getElementById('searchName').value = '';
            document.getElementById('filterStatus').value = '';
            filteredVoters = [...allVoters];
            currentPage = 0;
            renderTable();
        }

        function prevPage() {
            if (currentPage > 0) { currentPage--;
                renderTable(); }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredVoters.length / PAGE_SIZE);
            if (currentPage < totalPages - 1) { currentPage++;
                renderTable(); }
        }

        // ============================================
        // MODAL (Add/Edit)
        // ============================================
        function openModal(voter = null) {
            const modal = document.getElementById('modal');
            modal.classList.add('active');

            if (voter) {
                document.getElementById('modalTitle').textContent = 'Edit Voter';
                document.getElementById('editId').value = voter.id;
                document.getElementById('formName').value = voter.name || '';
                document.getElementById('formNationalId').value = voter.national_id || '';
                document.getElementById('formDistrict').value = voter.district || '';
                document.getElementById('formHouse').value = voter.house || '';
                document.getElementById('formPhone').value = voter.phone || '';
                document.getElementById('formStatus').value = voter.status || 'Not Contacted';
                document.getElementById('formParty').value = voter.party || '';
                document.getElementById('formSex').value = voter.sex || '';
                document.getElementById('formAge').value = voter.age || '';
                document.getElementById('formNotes').value = voter.notes || '';
            } else {
                document.getElementById('modalTitle').textContent = 'Add Voter';
                document.getElementById('editId').value = '';
                document.getElementById('voterForm').reset();
                document.getElementById('formStatus').value = 'Not Contacted';
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // ============================================
        // HANDLE SUBMIT
        // ============================================
        async function handleSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                name: document.getElementById('formName').value.trim(),
                national_id: document.getElementById('formNationalId').value.trim(),
                district: document.getElementById('formDistrict').value.trim(),
                house: document.getElementById('formHouse').value.trim(),
                phone: document.getElementById('formPhone').value.trim(),
                status: document.getElementById('formStatus').value,
                party: document.getElementById('formParty').value.trim(),
                sex: document.getElementById('formSex').value.trim(),
                age: parseInt(document.getElementById('formAge').value) || null,
                notes: document.getElementById('formNotes').value.trim(),
                updated_at: new Date().toISOString()
            };

            try {
                if (id) {
                    await supabase.from('voters').update(data).eq('id', id);
                    showToast('✅ Voter updated!', 'success');
                } else {
                    data.created_at = new Date().toISOString();
                    await supabase.from('voters').insert([data]);
                    showToast('✅ Voter added!', 'success');
                }
                closeModal();
                loadVoters();
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        // ============================================
        // DELETE VOTER
        // ============================================
        async function deleteVoter(id) {
            if (!confirm('Delete this voter?')) return;
            try {
                await supabase.from('voters').delete().eq('id', id);
                showToast('🗑️ Voter deleted', 'success');
                loadVoters();
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        // ============================================
        // EDIT VOTER
        // ============================================
        function editVoter(id) {
            const voter = allVoters.find(v => v.id === id);
            if (voter) openModal(voter);
        }

        // ============================================
        // EXPORT CSV
        // ============================================
        function exportCSV() {
            if (filteredVoters.length === 0) {
                showToast('No data to export', 'error');
                return;
            }

            const headers = ['Name', 'National ID', 'District', 'House', 'Status', 'Party', 'Sex', 'Age', 'Phone', 'Notes'];
            const rows = filteredVoters.map(v => [
                v.name || '', v.national_id || '', v.district || '', v.house || '',
                v.status || 'Not Contacted', v.party || '', v.sex || '', v.age || '', v.phone || '', v.notes || ''
            ]);

            const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `voters_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 Export successful!', 'success');
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            clearTimeout(toast.timeout);
            toast.timeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // ============================================
        // START
        // ============================================
        document.addEventListener('DOMContentLoaded', autoLogin);

        console.log('🗳️ Voter App Loaded!');
        console.log('🔗 Supabase URL:', SUPABASE_URL);
    </script>

</body>
</html>
