<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampaignHQ - Voter Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: #1a1a2e; color: white; padding: 20px 30px; border-radius: 12px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .header h1 { font-size: 24px; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .header-actions button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .btn-white { background: white; color: #1a1a2e; }
        .btn-green { background: #22c55e; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .user-info { color: #94a3b8; font-size: 14px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #3b82f6; }
        .card .number { font-size: 28px; font-weight: 700; }
        .card .label { font-size: 11px; color: #6b7280; text-transform: uppercase; font-weight: 600; }
        .number.blue { color: #3b82f6; } .number.green { color: #22c55e; } .number.red { color: #ef4444; }
        .number.yellow { color: #f59e0b; } .number.gray { color: #6b7280; } .number.teal { color: #14b8a6; }
        .number.orange { color: #f97316; } .number.purple { color: #8b5cf6; }
        .filters { background: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .filters input, .filters select { padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; flex: 1; min-width: 150px; font-size: 14px; }
        .table-container { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #f8fafc; padding: 12px 16px; text-align: left; font-weight: 600; border-bottom: 2px solid #e2e8f0; }
        td { padding: 10px 16px; border-bottom: 1px solid #f1f5f9; }
        tr:hover { background: #f8fafc; }
        .status { padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .status-Not-Contacted { background: #e5e7eb; color: #4b5563; }
        .status-Reached { background: #dbeafe; color: #1e40af; }
        .status-Supporter { background: #ede9fe; color: #6d28d9; }
        .status-Undecided { background: #fef3c7; color: #92400e; }
        .status-Opposition { background: #fee2e2; color: #991b1b; }
        .status-Need-Follow-up { background: #ffedd5; color: #9a3412; }
        .status-Absent { background: #e0e7ff; color: #3730a3; }
        .actions { display: flex; gap: 5px; flex-wrap: wrap; }
        .actions button { padding: 4px 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
        .btn-edit { background: #dbeafe; color: #2563eb; }
        .btn-delete { background: #fee2e2; color: #dc2626; }
        .btn-supporter { background: #ede9fe; color: #6d28d9; }
        .btn-opposition { background: #fee2e2; color: #991b1b; }
        .btn-undecided { background: #fef3c7; color: #92400e; }
        .btn-reached { background: #dbeafe; color: #1e40af; }
        .btn-followup { background: #ffedd5; color: #9a3412; }
        .btn-absent { background: #e0e7ff; color: #3730a3; }
        .pagination { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; flex-wrap: wrap; gap: 10px; }
        .pagination button { padding: 8px 16px; border: 1px solid #d1d5db; border-radius: 6px; background: white; cursor: pointer; font-weight: 500; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading { text-align: center; padding: 40px; color: #6b7280; }
        .toast { position: fixed; bottom: 30px; right: 30px; padding: 14px 28px; border-radius: 10px; color: white; font-weight: 600; display: none; z-index: 999; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .toast.success { background: #22c55e; } .toast.error { background: #ef4444; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; max-width: 550px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-content .close { float: right; font-size: 28px; cursor: pointer; color: #6b7280; }
        .modal-content label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 15px; font-size: 14px; font-family: inherit; }
        .modal-actions { display: flex; gap: 12px; margin-top: 15px; }
        .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
        @media (max-width: 768px) { body { padding: 10px; } .header { flex-direction: column; text-align: center; } .header-actions { justify-content: center; } .cards { grid-template-columns: repeat(3, 1fr); } .filters { flex-direction: column; } .filters input, .filters select { width: 100%; min-width: unset; } }
        @media (max-width: 480px) { .cards { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>🗳️ CampaignHQ</h1>
            <div class="header-actions">
                <span class="user-info" id="userInfo"></span>
                <button class="btn-white" onclick="exportCSV()">📤 Export</button>
                <button class="btn-green" onclick="openModal()">➕ Add</button>
                <button class="btn-blue" onclick="window.location.href='mobile.html'">📱 Mobile</button>
            </div>
        </header>

        <div class="cards">
            <div class="card"><div class="number blue" id="total">0</div><div class="label">Total</div></div>
            <div class="card"><div class="number green" id="supporters">0</div><div class="label">Supporters</div></div>
            <div class="card"><div class="number red" id="opposition">0</div><div class="label">Opposition</div></div>
            <div class="card"><div class="number yellow" id="undecided">0</div><div class="label">Undecided</div></div>
            <div class="card"><div class="number teal" id="reached">0</div><div class="label">Reached</div></div>
            <div class="card"><div class="number gray" id="notContacted">0</div><div class="label">Not Contacted</div></div>
            <div class="card"><div class="number orange" id="needFollowup">0</div><div class="label">Follow-up</div></div>
            <div class="card"><div class="number purple" id="absent">0</div><div class="label">Absent</div></div>
        </div>

        <div class="filters">
            <input type="text" id="searchName" placeholder="🔍 Search by name..." oninput="applyFilters()">
            <input type="text" id="searchDistrict" placeholder="📍 District..." oninput="applyFilters()">
            <select id="filterStatus" onchange="applyFilters()">
                <option value="">All Status</option>
                <option value="Not Contacted">Not Contacted</option>
                <option value="Reached">Reached</option>
                <option value="Supporter">Supporter</option>
                <option value="Undecided">Undecided</option>
                <option value="Opposition">Opposition</option>
                <option value="Need Follow-up">Need Follow-up</option>
                <option value="Absent">Absent</option>
            </select>
            <button class="btn-blue" onclick="applyFilters()">Apply</button>
            <button style="background:#e5e7eb;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:600;" onclick="clearFilters()">Clear</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Name</th><th>National ID</th><th>District</th><th>Status</th><th>Party</th><th>Sex</th><th>Age</th><th>Actions</th></tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="8" class="loading">Loading voters...</td></tr>
                </tbody>
            </table>
            <div class="pagination">
                <span id="pageInfo">Showing 0-0 of 0</span>
                <div>
                    <button id="prevBtn" onclick="prevPage()">← Prev</button>
                    <button id="nextBtn" onclick="nextPage()">Next →</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Add Voter</h2>
            <form id="voterForm" onsubmit="handleSubmit(event)">
                <input type="hidden" id="editId">
                <label>Full Name *</label><input type="text" id="formName" required>
                <label>National ID *</label><input type="text" id="formNationalId" required>
                <label>District</label><input type="text" id="formDistrict">
                <label>House</label><input type="text" id="formHouse">
                <label>Phone</label><input type="text" id="formPhone">
                <label>Status</label>
                <select id="formStatus">
                    <option value="Not Contacted">Not Contacted</option>
                    <option value="Reached">Reached</option>
                    <option value="Supporter">Supporter</option>
                    <option value="Undecided">Undecided</option>
                    <option value="Opposition">Opposition</option>
                    <option value="Need Follow-up">Need Follow-up</option>
                    <option value="Absent">Absent</option>
                </select>
                <label>Party</label><input type="text" id="formParty">
                <label>Sex</label><input type="text" id="formSex">
                <label>Age</label><input type="number" id="formAge">
                <label>Notes</label><textarea id="formNotes" rows="3"></textarea>
                <div class="modal-actions">
                    <button type="button" style="background:#e5e7eb;" onclick="closeModal()">Cancel</button>
                    <button type="submit" style="background:#22c55e;color:white;">✅ Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================
        // ✅ THIS IS IDENTICAL TO YOUR WORKING test.html
        // ============================================
        const SUPABASE_URL = 'https://sbomlqemmtcfahtgllzx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tU-qC7J1igIq0R_UM1_COA_F-uVpA9Y';

        if (typeof window.supabase === 'undefined') {
            document.getElementById('tableBody').innerHTML =
                '<tr><td colspan="8" class="loading">❌ Supabase library failed to load!</td></tr>';
            throw new Error('Supabase library not loaded');
        }

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const EMAIL = 'admin@campaign.com';
        const PASSWORD = 'Campaign123!';

        let allVoters = [];
        let filteredVoters = [];
        let currentPage = 0;
        const PAGE_SIZE = 20;

        async function autoLogin() {
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email: EMAIL, password: PASSWORD });
                if (error) throw error;
                localStorage.setItem('user', JSON.stringify(data.user));
                document.getElementById('userInfo').textContent = '✅ ' + data.user.email;
                await loadVoters();
                showToast('✅ Logged in successfully!', 'success');
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('userInfo').textContent = '❌ Login failed';
                showToast('❌ Login failed: ' + error.message, 'error');
                document.getElementById('tableBody').innerHTML =
                    `<tr><td colspan="8" class="loading">❌ Login failed: ${error.message}</td></tr>`;
            }
        }

        async function loadVoters() {
            try {
                const { data, error } = await supabase.from('voters').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allVoters = data || [];
                filteredVoters = [...allVoters];
                updateDashboard();
                renderTable();
                console.log('✅ Loaded', allVoters.length, 'voters');
                showToast('✅ Loaded ' + allVoters.length + ' voters', 'success');
            } catch (error) {
                console.error('Error loading:', error);
                showToast('❌ Error: ' + error.message, 'error');
                document.getElementById('tableBody').innerHTML =
                    `<tr><td colspan="8" class="loading">❌ ${error.message}</td></tr>`;
            }
        }

        function updateDashboard() {
            const total = allVoters.length;
            const supporters = allVoters.filter(v => v.status === 'Supporter').length;
            const opposition = allVoters.filter(v => v.status === 'Opposition').length;
            const undecided = allVoters.filter(v => v.status === 'Undecided').length;
            const reached = allVoters.filter(v => v.status === 'Reached').length;
            const notContacted = allVoters.filter(v => !v.status || v.status === 'Not Contacted').length;
            const needFollowup = allVoters.filter(v => v.status === 'Need Follow-up').length;
            const absent = allVoters.filter(v => v.status === 'Absent').length;

            document.getElementById('total').textContent = total;
            document.getElementById('supporters').textContent = supporters;
            document.getElementById('opposition').textContent = opposition;
            document.getElementById('undecided').textContent = undecided;
            document.getElementById('reached').textContent = reached;
            document.getElementById('notContacted').textContent = notContacted;
            document.getElementById('needFollowup').textContent = needFollowup;
            document.getElementById('absent').textContent = absent;
        }

        function renderTable() {
            const start = currentPage * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, filteredVoters.length);
            const pageData = filteredVoters.slice(start, end);
            const tbody = document.getElementById('tableBody');

            if (filteredVoters.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="loading">No voters found</td></tr>';
                document.getElementById('pageInfo').textContent = 'Showing 0-0 of 0';
                document.getElementById('prevBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                return;
            }

            tbody.innerHTML = pageData.map(v => `
                        <tr>
                            <td><strong>${v.name || 'Unknown'}</strong></td>
                            <td>${v.national_id || '-'}</td>
                            <td>${v.district || '-'}</td>
                            <td><span class="status status-${(v.status || 'Not-Contacted').replace(/ /g, '-')}">${v.status || 'Not Contacted'}</span></td>
                            <td>${v.party || '-'}</td>
                            <td>${v.sex || '-'}</td>
                            <td>${v.age || '-'}</td>
                            <td class="actions">
                                <button class="btn-reached" onclick="setStatus('${v.id}','Reached')">📞</button>
                                <button class="btn-supporter" onclick="setStatus('${v.id}','Supporter')">👍</button>
                                <button class="btn-undecided" onclick="setStatus('${v.id}','Undecided')">🤔</button>
                                <button class="btn-opposition" onclick="setStatus('${v.id}','Opposition')">👎</button>
                                <button class="btn-followup" onclick="setStatus('${v.id}','Need Follow-up')">⏰</button>
                                <button class="btn-absent" onclick="setStatus('${v.id}','Absent')">🚫</button>
                                <button class="btn-edit" onclick="editVoter('${v.id}')">✏️</button>
                                <button class="btn-delete" onclick="deleteVoter('${v.id}')">🗑️</button>
                            </td>
                        </tr>
                    `).join('');

            document.getElementById('pageInfo').textContent = `Showing ${start + 1}-${end} of ${filteredVoters.length}`;
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage >= Math.ceil(filteredVoters.length / PAGE_SIZE) - 1;
        }

        async function setStatus(id, status) {
            try {
                const { error } = await supabase.from('voters').update({ status, updated_at: new Date().toISOString() }).eq('id',
                    id);
                if (error) throw error;
                showToast('✅ Status updated to: ' + status, 'success');
                loadVoters();
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        function applyFilters() {
            const name = document.getElementById('searchName').value.toLowerCase().trim();
            const district = document.getElementById('searchDistrict').value.toLowerCase().trim();
            const status = document.getElementById('filterStatus').value;

            filteredVoters = allVoters.filter(v => {
                let match = true;
                if (name) match = match && (v.name || '').toLowerCase().includes(name);
                if (district) match = match && (v.district || '').toLowerCase().includes(district);
                if (status) match = match && (v.status || '') === status;
                return match;
            });

            currentPage = 0;
            renderTable();
        }

        function clearFilters() {
            document.getElementById('searchName').value = '';
            document.getElementById('searchDistrict').value = '';
            document.getElementById('filterStatus').value = '';
            filteredVoters = [...allVoters];
            currentPage = 0;
            renderTable();
        }

        function prevPage() { if (currentPage > 0) { currentPage--; renderTable(); } }
        function nextPage() { const totalPages = Math.ceil(filteredVoters.length / PAGE_SIZE); if (currentPage < totalPages -
                1) { currentPage++; renderTable(); } }

        function openModal(voter = null) {
            const modal = document.getElementById('modal');
            modal.classList.add('active');

            if (voter) {
                document.getElementById('modalTitle').textContent = 'Edit Voter';
                document.getElementById('editId').value = voter.id;
                document.getElementById('formName').value = voter.name || '';
                document.getElementById('formNationalId').value = voter.national_id || '';
                document.getElementById('formDistrict').value = voter.district || '';
                document.getElementById('formHouse').value = voter.house || '';
                document.getElementById('formPhone').value = voter.phone || '';
                document.getElementById('formStatus').value = voter.status || 'Not Contacted';
                document.getElementById('formParty').value = voter.party || '';
                document.getElementById('formSex').value = voter.sex || '';
                document.getElementById('formAge').value = voter.age || '';
                document.getElementById('formNotes').value = voter.notes || '';
            } else {
                document.getElementById('modalTitle').textContent = 'Add Voter';
                document.getElementById('editId').value = '';
                document.getElementById('voterForm').reset();
                document.getElementById('formStatus').value = 'Not Contacted';
            }
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        async function handleSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                name: document.getElementById('formName').value.trim(),
                national_id: document.getElementById('formNationalId').value.trim(),
                district: document.getElementById('formDistrict').value.trim(),
                house: document.getElementById('formHouse').value.trim(),
                phone: document.getElementById('formPhone').value.trim(),
                status: document.getElementById('formStatus').value,
                party: document.getElementById('formParty').value.trim(),
                sex: document.getElementById('formSex').value.trim(),
                age: document.getElementById('formAge').value || null,
                notes: document.getElementById('formNotes').value.trim(),
                updated_at: new Date().toISOString()
            };

            try {
                if (id) {
                    await supabase.from('voters').update(data).eq('id', id);
                    showToast('✅ Voter updated!', 'success');
                } else {
                    data.created_at = new Date().toISOString();
                    await supabase.from('voters').insert([data]);
                    showToast('✅ Voter added!', 'success');
                }
                closeModal();
                loadVoters();
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        async function deleteVoter(id) {
            if (!confirm('Delete this voter?')) return;
            try {
                await supabase.from('voters').delete().eq('id', id);
                showToast('🗑️ Voter deleted', 'success');
                loadVoters();
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            }
        }

        function editVoter(id) { const voter = allVoters.find(v => v.id === id); if (voter) openModal(voter); }

        function exportCSV() {
            if (filteredVoters.length === 0) { showToast('No data to export', 'error'); return; }
            const headers = ['Name', 'National ID', 'District', 'House', 'Status', 'Party', 'Sex', 'Age', 'Phone', 'Notes'];
            const rows = filteredVoters.map(v => [
                v.name || '', v.national_id || '', v.district || '', v.house || '',
                v.status || 'Not Contacted', v.party || '', v.sex || '', v.age || '', v.phone || '', v.notes || ''
            ]);
            const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `voters_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 Export successful!', 'success');
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            clearTimeout(toast.timeout);
            toast.timeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        document.addEventListener('DOMContentLoaded', autoLogin);
        console.log('🗳️ CampaignHQ Loaded!');
        console.log('🔗 URL:', SUPABASE_URL);
    </script>

</body>
</html>
