<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f4f6;
            padding: 1rem;
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .back-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        .progress-text {
            font-size: 0.875rem;
            color: #6b7280;
        }
        .progress-bar {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            margin-bottom: 1rem;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: #3b82f6;
            transition: width 0.3s;
        }
        .voter-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .voter-name {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
        }
        .voter-detail {
            text-align: center;
            color: #6b7280;
            margin: 0.25rem 0;
        }
        .status-display {
            text-align: center;
            margin: 1rem 0;
        }
        .status-badge {
            padding: 0.25rem 1rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.875rem;
        }
        .status-Not-Contacted {
            background: #e5e7eb;
            color: #4b5563;
        }
        .status-Reached {
            background: #dbeafe;
            color: #1e40af;
        }
        .status-Supporter {
            background: #ede9fe;
            color: #6d28d9;
        }
        .status-Undecided {
            background: #fef3c7;
            color: #92400e;
        }
        .status-Opposition {
            background: #fee2e2;
            color: #991b1b;
        }
        .status-Need-Follow-up {
            background: #ffedd5;
            color: #9a3412;
        }
        .status-Absent {
            background: #e0e7ff;
            color: #3730a3;
        }
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        .status-grid button {
            padding: 0.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }
        .status-grid button:active {
            transform: scale(0.95);
        }
        .s-reached {
            background: #dbeafe;
            color: #1e40af;
        }
        .s-supporter {
            background: #ede9fe;
            color: #6d28d9;
        }
        .s-undecided {
            background: #fef3c7;
            color: #92400e;
        }
        .s-opposition {
            background: #fee2e2;
            color: #991b1b;
        }
        .s-followup {
            background: #ffedd5;
            color: #9a3412;
        }
        .s-absent {
            background: #e0e7ff;
            color: #3730a3;
        }
        .notes-section {
            margin: 1rem 0;
        }
        .notes-section textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-family: inherit;
        }
        .nav-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }
        .nav-buttons button {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-prev {
            background: #e5e7eb;
            color: #4b5563;
        }
        .btn-next {
            background: #3b82f6;
            color: white;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            color: white;
            font-weight: 500;
            display: none;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
        }
        .toast.success {
            background: #22c55e;
        }
        .toast.error {
            background: #ef4444;
        }
        .toast.info {
            background: #3b82f6;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            display: none;
        }
        .empty-state .icon {
            font-size: 4rem;
        }
        .location {
            font-size: 0.75rem;
            color: #6b7280;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <a href="/voters/app.html" class="back-link">← Back</a>

    <div class="header">
        <h1>📱 Door-to-Door</h1>
        <span class="progress-text" id="progress">0 of 0</span>
    </div>

    <div class="progress-bar">
        <div class="fill" id="progressBar" style="width:0%"></div>
    </div>

    <div class="location" id="location">📍 Getting location...</div>

    <div id="emptyState" class="empty-state">
        <div class="icon">✅</div>
        <h3>All Done!</h3>
        <p>You've completed all visits.</p>
        <button class="btn-next" onclick="location.reload()" style="margin-top:1rem;padding:0.75rem 1.5rem;border:none;border-radius:0.5rem;cursor:pointer;">🔄 Refresh</button>
    </div>

    <div id="voterCard" class="voter-card" style="display:none;">
        <h2 class="voter-name" id="voterName">Loading...</h2>
        <p class="voter-detail" id="voterPhone">📞 No phone</p>
        <p class="voter-detail" id="voterAddress">🏠 No address</p>

        <div class="status-display">
            <span class="status-badge" id="voterStatus">Not Contacted</span>
        </div>

        <div class="notes-section">
            <textarea id="notesInput" placeholder="Add notes..." rows="2"></textarea>
        </div>

        <div class="status-grid">
            <button class="s-reached" data-status="Reached">✅ Reached</button>
            <button class="s-supporter" data-status="Supporter">👍 Supporter</button>
            <button class="s-undecided" data-status="Undecided">🤔 Undecided</button>
            <button class="s-opposition" data-status="Opposition">👎 Opposition</button>
            <button class="s-followup" data-status="Need Follow-up">⏰ Follow-up</button>
            <button class="s-absent" data-status="Absent">🚫 Absent</button>
        </div>

        <div class="nav-buttons">
            <button class="btn-prev" id="prevBtn">← Previous</button>
            <button class="btn-next" id="nextBtn">Next →</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const supabase = supabaseClient.createClient(
            'https://sbomlqemmtcfahtgllzx.supabase.co',
            'sb_publishable_tU-qC7J1igIq0R_UM1_COA_F-uVpA9Y'
        );

        if (!localStorage.getItem('user')) {
            window.location.href = '/voters/login.html';
        }

        let voters = [];
        let currentIndex = 0;
        let toastTimeout;

        async function loadVoters() {
            try {
                const { data, error } = await supabase
                    .from('voters')
                    .select('*')
                    .order('created_at', { ascending: false });
                if (error) throw error;
                voters = data || [];
                if (voters.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                    document.getElementById('voterCard').style.display = 'none';
                } else {
                    document.getElementById('voterCard').style.display = 'block';
                    showVoter();
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        function showVoter() {
            if (voters.length === 0 || currentIndex >= voters.length) {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('voterCard').style.display = 'none';
                return;
            }
            const v = voters[currentIndex];
            document.getElementById('voterName').textContent = v.name || 'Unknown';
            document.getElementById('voterPhone').textContent = v.phone ? '📞 ' + v.phone : '📞 No phone';
            document.getElementById('voterAddress').textContent = v.district ? '🏠 ' + v.district + (v.house ? ', ' + v.house :
                '') : '🏠 No address';
            const status = v.status || 'Not Contacted';
            const statusEl = document.getElementById('voterStatus');
            statusEl.textContent = status;
            statusEl.className = 'status-badge status-' + status.replace(/ /g, '-');
            document.getElementById('progress').textContent = (currentIndex + 1) + ' of ' + voters.length;
            document.getElementById('progressBar').style.width = ((currentIndex + 1) / voters.length * 100) + '%';
            document.getElementById('notesInput').value = '';
            document.getElementById('prevBtn').disabled = currentIndex === 0;
        }

        async function setStatus(status) {
            if (voters.length === 0) return;
            const v = voters[currentIndex];
            const notes = document.getElementById('notesInput').value;
            try {
                await supabase.from('voters').update({ status }).eq('id', v.id);
                v.status = status;
                showVoter();
                showToast('✅ Status: ' + status, 'success');
                setTimeout(() => {
                    if (currentIndex < voters.length - 1) {
                        currentIndex++;
                        showVoter();
                    } else {
                        showToast('🎉 All done!', 'info');
                        setTimeout(() => {
                            document.getElementById('emptyState').style.display = 'block';
                            document.getElementById('voterCard').style.display = 'none';
                        }, 1500);
                    }
                }, 800);
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        document.querySelectorAll('.status-grid button').forEach(btn => {
            btn.addEventListener('click', () => setStatus(btn.dataset.status));
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < voters.length - 1) { currentIndex++;
                showVoter(); }
        });
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) { currentIndex--;
                showVoter(); }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (currentIndex < voters.length - 1) { currentIndex++;
                    showVoter(); } }
            if (e.key === 'ArrowLeft') { e.preventDefault(); if (currentIndex > 0) { currentIndex--;
                    showVoter(); } }
            const statuses = ['Reached', 'Supporter', 'Undecided', 'Opposition', 'Need Follow-up', 'Absent'];
            const num = parseInt(e.key);
            if (num >= 1 && num <= 6) { setStatus(statuses[num - 1]); }
        });

        if ('geolocation' in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => { document.getElementById('location').textContent = '📍 ' + pos.coords.latitude.toFixed(6) + ', ' +
                        pos.coords.longitude.toFixed(6); },
                () => { document.getElementById('location').textContent = '📍 Location unavailable'; }
            );
        }

        loadVoters();
    </script>
</body>
</html>
