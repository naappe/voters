<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test - Voter Connection</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 20px;
        }
        .status-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .status-box h3 {
            margin-bottom: 10px;
            color: #1a1a2e;
        }
        .status-item {
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 6px;
            font-size: 14px;
        }
        .status-success {
            background: #d1fae5;
            color: #065f46;
        }
        .status-error {
            background: #fee2e2;
            color: #991b1b;
        }
        .status-info {
            background: #dbeafe;
            color: #1e40af;
        }
        .table-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: #f8fafc;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 10px 16px;
            border-bottom: 1px solid #f1f5f9;
        }
        tr:hover {
            background: #f8fafc;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .status-Not-Contacted {
            background: #e5e7eb;
            color: #4b5563;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        .count-badge {
            background: #3b82f6;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        #results {
            margin-top: 10px;
        }
        .step {
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 8px;
            background: white;
            border-left: 4px solid #3b82f6;
        }
        .step.done {
            border-left-color: #22c55e;
            background: #f0fdf4;
        }
        .step.fail {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        .step .emoji {
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧪 Voter Connection Test</h1>

        <!-- Status Box -->
        <div class="status-box">
            <h3>📊 Connection Status</h3>
            <div id="results">
                <div class="step" id="step1">
                    <span class="emoji">⏳</span> Step 1: Loading Supabase...
                </div>
                <div class="step" id="step2">
                    <span class="emoji">⏳</span> Step 2: Connecting to Supabase...
                </div>
                <div class="step" id="step3">
                    <span class="emoji">⏳</span> Step 3: Logging in...
                </div>
                <div class="step" id="step4">
                    <span class="emoji">⏳</span> Step 4: Fetching voters...
                </div>
            </div>
            <div id="summary" style="margin-top:15px;font-weight:bold;font-size:16px;"></div>
        </div>

        <!-- Results -->
        <div id="voterCount" style="margin-bottom:15px;font-size:18px;font-weight:bold;color:#1a1a2e;">
            Total Voters: <span id="count">0</span>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>National ID</th>
                        <th>District</th>
                        <th>Status</th>
                        <th>Party</th>
                        <th>Sex</th>
                        <th>Age</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="8" class="loading">⏳ Loading voters...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ============================================
        // SUPABASE CONFIG
        // ============================================
        const SUPABASE_URL = 'https://sbomlqemmtcfahtgllzx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tU-qC7J1igIq0R_UM1_COA_F-uVpA9Y';

        // Step 1: Check if Supabase loaded
        function updateStep(id, status, message) {
            const el = document.getElementById(id);
            if (status === 'done') {
                el.className = 'step done';
                el.innerHTML = `<span class="emoji">✅</span> ${message}`;
            } else if (status === 'fail') {
                el.className = 'step fail';
                el.innerHTML = `<span class="emoji">❌</span> ${message}`;
            } else {
                el.className = 'step';
                el.innerHTML = `<span class="emoji">⏳</span> ${message}`;
            }
        }

        function showSummary(message, isError = false) {
            const el = document.getElementById('summary');
            el.textContent = message;
            el.style.color = isError ? '#dc2626' : '#16a34a';
        }

        async function runTest() {
            // Step 1: Check Supabase library
            if (typeof window.supabase === 'undefined') {
                updateStep('step1', 'fail', 'Supabase library failed to load! Check your internet connection.');
                showSummary('❌ Test Failed: Supabase library not loaded', true);
                return;
            }
            updateStep('step1', 'done', 'Supabase library loaded ✅');

            // Step 2: Connect to Supabase
            try {
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                updateStep('step2', 'done', 'Connected to Supabase ✅');

                // Step 3: Login
                const EMAIL = 'admin@campaign.com';
                const PASSWORD = 'Campaign123!';

                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: EMAIL,
                    password: PASSWORD
                });

                if (authError) {
                    updateStep('step3', 'fail', `Login failed: ${authError.message}`);
                    showSummary('❌ Login failed - Create user in Supabase Auth', true);
                    document.getElementById('tableBody').innerHTML =
                        `<tr><td colspan="8" class="loading">❌ Login failed: ${authError.message}</td></tr>`;
                    return;
                }

                updateStep('step3', 'done', `Logged in as: ${authData.user.email} ✅`);

                // Step 4: Fetch voters
                const { data: voters, error: votersError } = await supabase
                    .from('voters')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(20);

                if (votersError) {
                    updateStep('step4', 'fail', `Failed to fetch voters: ${votersError.message}`);
                    showSummary('❌ Error fetching voters', true);
                    document.getElementById('tableBody').innerHTML =
                        `<tr><td colspan="8" class="loading">❌ Error: ${votersError.message}</td></tr>`;
                    return;
                }

                updateStep('step4', 'done', `Fetched ${voters.length} voters ✅`);

                // Update count
                document.getElementById('count').textContent = voters.length;

                // Show summary
                showSummary(`✅ Success! Loaded ${voters.length} voters. Your app is working!`);

                // Render table
                if (voters.length === 0) {
                    document.getElementById('tableBody').innerHTML =
                        `<tr><td colspan="8" class="loading">No voters found in database.</td></tr>`;
                    return;
                }

                document.getElementById('tableBody').innerHTML = voters.map((v, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td><strong>${v.name || 'Unknown'}</strong></td>
                        <td>${v.national_id || '-'}</td>
                        <td>${v.district || '-'}</td>
                        <td><span class="status-badge status-${(v.status || 'Not-Contacted').replace(/ /g, '-')}">${v.status || 'Not Contacted'}</span></td>
                        <td>${v.party || '-'}</td>
                        <td>${v.sex || '-'}</td>
                        <td>${v.age || '-'}</td>
                    </tr>
                `).join('');

            } catch (error) {
                updateStep('step2', 'fail', `Error: ${error.message}`);
                showSummary('❌ Test Failed: ' + error.message, true);
                document.getElementById('tableBody').innerHTML =
                    `<tr><td colspan="8" class="loading">❌ Error: ${error.message}</td></tr>`;
            }
        }

        // Run the test
        document.addEventListener('DOMContentLoaded', runTest);

        console.log('🧪 Voter Test Started!');
        console.log('🔗 Supabase URL:', SUPABASE_URL);
    </script>

</body>
</html>
